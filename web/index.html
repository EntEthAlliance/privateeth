<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Only this site's own scripts may run (WebAssembly is needed for the proofs). Network access
     is limited to https (public or chosen RPC, proving parameters) and local test nodes. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; connect-src 'self' data: https: http://127.0.0.1:* http://localhost:*; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>PrivateEth · Private Payments Demo</title>
<meta name="description" content="Two banks pay each other privately on Ethereum Sepolia with zero-knowledge proofs, and a regulator reads the payment with viewing keys.">
<!-- Enables cross-origin isolation on static hosting so proofs can use several threads. Must load first. -->
<script src="./coi-serviceworker.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" crossorigin="anonymous" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Kode+Mono:wght@400;600;700&display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231F5C4A'/%3E%3Cpath d='M16 5l8 11-8 4.6L8 16z' fill='%23EDEAE3'/%3E%3Cpath d='M8 18l8 4.6 8-4.6-8 9z' fill='%23C9D6D0'/%3E%3C/svg%3E">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div class="wrap" id="app"><div class="empty">Loading…</div></div>
<div class="toast" id="toast" hidden><span class="lbl">Incoming</span><span id="toast-text"></span></div>
<script type="module" src="./main.js"></script>
</body>
</html>
